/* V4: clearer flow ordering + richer student preview */
.flow-card{grid-template-columns:30px 38px 1fr auto;position:relative}

function newBlock(type){const c=catalog[type],b={id:id(),type,name:c.label,title:c.label};

 if(type==='mood')Object.assign(b,{title:'지금 내 마음은 어디쯤인가요?',note:'무드미터에서 현재 마음과 가까운 위치를 골라보세요.',emotionLabels:['편안함','기대됨','걱정됨','답답함']});

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function validActivity(a){return a&&typeof a.title==='string'&&Array.isArray(a.blocks)&&a.blocks.length>0&&a.blocks.every(b=>b&&typeof b==='object'&&catalog[b.type])}
const STORE_KEY='drama-reflect-builder-library-v1';
const STORE_BACKUP_KEY='drama-reflect-builder-library-v1-backup';
const OLD_LIBRARY_KEYS=['meet-reflect-library-v1','meet-reflect-library-v1-backup'];
const ACTIVE_USER_ID='local-user';
const LEGACY_KEYS=['meet-reflect-general-v5','meet-reflect-general-v4','meet-reflect-general-v3','meet-reflect-v2'];
function nowISO(){return new Date().toISOString()}
function activityId(){return 'act_'+Date.now().toString(36)+'_'+id()}
function emptyStore(){return {schemaVersion:1,activeUserId:ACTIVE_USER_ID,currentActivityId:null,users:{[ACTIVE_USER_ID]:{name:'이 브라우저 사용자',activityOrder:[],activities:{}}},migration:{legacyImported:false}}}
function ensureUser(store){store.users=store.users||{};store.activeUserId=store.activeUserId||ACTIVE_USER_ID;if(!store.users[store.activeUserId])store.users[store.activeUserId]={name:'이 브라우저 사용자',activityOrder:[],activities:{},trash:{},sessions:{}};const u=store.users[store.activeUserId];u.activities=u.activities||{};u.activityOrder=Array.isArray(u.activityOrder)?u.activityOrder.filter(x=>u.activities[x]):Object.keys(u.activities);u.trash=u.trash||{};u.sessions=u.sessions||{};return u}
function normalizeActivity(value,source='new'){if(!validActivity(value))return null;const a=clone(value);a.id=(typeof a.id==='string'&&a.id)?a.id:activityId();a.ownerId=ACTIVE_USER_ID;a.createdAt=a.createdAt||nowISO();a.updatedAt=a.updatedAt||a.createdAt;a.source=source;a.blocks=(a.blocks||[]).filter(b=>b&&catalog[b.type]).map(b=>{const x=clone(b);x.id=(typeof x.id==='string'&&x.id)?x.id:id();return x});if(!a.blocks.length)a.blocks=[newBlock('intro')];return a}
function fingerprint(a){try{return JSON.stringify({title:a.title,blocks:(a.blocks||[]).map(b=>{const x=clone(b);delete x.id;return x})})}catch(e){return a&&a.title||''}}
function validStore(store){try{if(!store||store.schemaVersion!==1||!store.users)return false;const u=store.users[store.activeUserId||ACTIVE_USER_ID];return !!(u&&u.activities&&Array.isArray(u.activityOrder))}catch(e){return false}}
function writeStore(store,withBackup=true){try{const old=localStorage.getItem(STORE_KEY);if(withBackup&&old)localStorage.setItem(STORE_BACKUP_KEY,old);localStorage.setItem(STORE_KEY,JSON.stringify(store));return true}catch(e){console.warn('저장 실패',e);return false}}
function addActivityToStore(store,activity,makeCurrent=true){const u=ensureUser(store);const a=normalizeActivity(activity,activity.source||'new');if(!a)return null;while(u.activities[a.id])a.id=activityId();u.activities[a.id]=a;u.activityOrder=[a.id,...u.activityOrder.filter(x=>x!==a.id)];if(makeCurrent)store.currentActivityId=a.id;return a}
function loadStore(){let store=null;let importedOldLibrary=false;for(const key of [STORE_KEY,STORE_BACKUP_KEY]){try{const raw=localStorage.getItem(key);if(!raw)continue;const parsed=JSON.parse(raw);if(validStore(parsed)){store=parsed;break}}catch(e){}}if(!store){for(const key of OLD_LIBRARY_KEYS){try{const raw=localStorage.getItem(key);if(!raw)continue;const parsed=JSON.parse(raw);if(validStore(parsed)){store=clone(parsed);importedOldLibrary=true;break}}catch(e){}}}if(!store)store=emptyStore();const u=ensureUser(store);store.migration=store.migration||{};if(importedOldLibrary){store.migration.oldLibraryImported=true;store.migration.oldLibraryImportedAt=nowISO()}if(!store.migration.legacyImported){const seen=new Set(Object.values(u.activities).map(fingerprint));for(const key of LEGACY_KEYS){try{const raw=localStorage.getItem(key);if(!raw)continue;const legacy=JSON.parse(raw);const a=normalizeActivity(legacy,'legacy:'+key);if(!a)continue;const fp=fingerprint(a);if(seen.has(fp))continue;a.title=a.title||'가져온 활동';a.legacySource=key;addActivityToStore(store,a,false);seen.add(fp)}catch(e){}}store.migration.legacyImported=true;store.migration.legacyImportedAt=nowISO()}
 if(!store.currentActivityId||!u.activities[store.currentActivityId])store.currentActivityId=u.activityOrder[0]||null;writeStore(store,false);return store}
function getUser(){return ensureUser(libraryStore)}
function getActivityById(aid){return getUser().activities[aid]||null}
function recentActivities(){return getUser().activityOrder.map(id=>getUser().activities[id]).filter(Boolean).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}
function openActivity(aid){const a=getActivityById(aid);if(!a)return false;libraryStore.currentActivityId=aid;state.activity=a;state.selected=a.blocks[0]?.id||null;state.tab='basic';state.previewIndex=0;state.flowBlock=0;state.flowSub=0;writeStore(libraryStore,false);return true}
function createActivity(template,source='new'){const a=normalizeActivity(template,source);if(!a)return null;addActivityToStore(libraryStore,a,true);writeStore(libraryStore);return a}
function duplicateActivity(aid){const src=getActivityById(aid);if(!src)return null;const copy=clone(src);delete copy.id;copy.title=(src.title||'활동')+' 복사본';copy.blocks=(copy.blocks||[]).map(b=>({...b,id:id()}));copy.createdAt=nowISO();copy.updatedAt=copy.createdAt;copy.source='duplicate';return createActivity(copy,'duplicate')}
function deleteActivityToTrash(aid){const u=getUser(),a=u.activities[aid];if(!a)return false;const moved=clone(a);moved.deletedAt=nowISO();u.trash[aid]=moved;delete u.activities[aid];u.activityOrder=u.activityOrder.filter(x=>x!==aid);if(libraryStore.currentActivityId===aid)libraryStore.currentActivityId=u.activityOrder[0]||null;writeStore(libraryStore);return true}
function latestTrash(){const u=getUser();return Object.values(u.trash||{}).sort((a,b)=>String(b.deletedAt||'').localeCompare(String(a.deletedAt||'')))[0]||null}
function restoreLatestTrash(){const u=getUser(),a=latestTrash();if(!a)return null;delete u.trash[a.id];delete a.deletedAt;a.updatedAt=nowISO();u.activities[a.id]=a;u.activityOrder=[a.id,...u.activityOrder.filter(x=>x!==a.id)];libraryStore.currentActivityId=a.id;writeStore(libraryStore);return a}
function validateForClass(a){const errors=[];if(!a||!validActivity(a))return ['활동 데이터가 올바르지 않습니다.'];if(!String(a.title||'').trim())errors.push('활동 제목을 입력하세요.');(a.blocks||[]).forEach((b,i)=>{const n=i+1,label=(catalog[b.type]?.label||b.type);if(!String(b.title||'').trim())errors.push(`${n}단계(${label})의 학생용 제목이 비어 있습니다.`);if(b.type==='choice'&&(b.options||[]).filter(x=>String(x).trim()).length<2)errors.push(`${n}단계(선택)는 선택지가 2개 이상 필요합니다.`);if((b.type==='reflection'||b.type==='connection')&&(b.questions||[]).filter(x=>String(x).trim()).length<1)errors.push(`${n}단계(${label})에 질문이 필요합니다.`);if(b.type==='emotion'&&!['emotion','intensity','body','impulse','reason'].some(k=>b.steps?.[k]!==false))errors.push(`${n}단계(감정 탐색)는 한 가지 탐색 요소 이상을 켜야 합니다.`);if(b.type==='meet'){if((b.questions||[]).filter(x=>String(x).trim()).length<1)errors.push(`${n}단계(만남)에 대화 질문이 필요합니다.`);if(!(Number(b.minutes)>0))errors.push(`${n}단계(만남)의 시간을 확인하세요.`)}});return errors}
function sessionCode(){return String(Math.floor(100000+Math.random()*900000))}
function sessionsForActivity(aid){return Object.values(getUser().sessions||{}).filter(x=>x&&x.activityId===aid).sort((a,b)=>String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||'')))}
function latestActiveSession(aid){return sessionsForActivity(aid).find(x=>x.status!=='ended')||null}
function sessionActivityCompatible(sess,a){if(!sess||!a||sess.activityId!==a.id)return false;const saved=Array.isArray(sess.blockIds)?sess.blockIds:null,current=(a.blocks||[]).map(b=>b.id);return !saved||(saved.length===current.length&&saved.every((x,i)=>x===current[i]))}

 bindMockPreview();bindLiveStudentInputs();bindDrag();
}
function bindMockPreview(){document.querySelectorAll('[data-mock-select]').forEach(el=>{el.onclick=e=>{e.stopPropagation();const p=el.parentElement;if(p)p.querySelectorAll('[data-mock-select]').forEach(x=>x.classList.remove('mock-selected'));el.classList.add('mock-selected');const s=el.closest('.screen')?.querySelector('.mock-state');if(s)s.textContent='모의 선택됨 · 저장되지 않습니다.'};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});document.querySelectorAll('[data-mock-mood]').forEach(grid=>{const choose=e=>{const r=grid.getBoundingClientRect();let clientX=e.clientX,clientY=e.clientY;if(e.touches&&e.touches[0]){clientX=e.touches[0].clientX;clientY=e.touches[0].clientY}const x=Math.max(.02,Math.min(.98,(clientX-r.left)/r.width)),y=Math.max(.02,Math.min(.98,(clientY-r.top)/r.height)),dot=grid.querySelector('.mood-dot');if(dot){dot.style.left=x*100+'%';dot.style.top=y*100+'%'}const words=moodHintWords({x,y}),hint=grid.closest('.screen')?.querySelector('[data-mood-hint]');if(hint)hint.innerHTML=`이 근처의 마음 · <b>${words.map(esc).join(' · ')}</b><span class="small-note">지금은 감정을 하나로 정답처럼 고르는 단계가 아니라, 내 위치 주변의 마음말을 살펴보는 단계예요. · 미리보기 응답은 저장되지 않음</span>`};grid.onclick=choose;grid.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=grid.getBoundingClientRect();choose({clientX:r.left+r.width/2,clientY:r.top+r.height/2})}}})}
function bindDrag(){let dragged=null,dropTarget=null,dropAfter=false;
 document.querySelectorAll('.drag-handle').forEach(handle=>{handle.addEventListener('dragstart',e=>{dragged=handle.dataset.dragId;state.draggingId=dragged;handle.closest('.flow-card').classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragged)}catch(_){} });});
 document.querySelectorAll('.flow-card').forEach(card=>{
   card.addEventListener('dragover',e=>{if(!dragged||card.dataset.id===dragged){dropTarget=null;return}e.preventDefault();document.querySelectorAll('.flow-card').forEach(x=>x.classList.remove('drop-before','drop-after'));const r=card.getBoundingClientRect();dropAfter=e.clientY>r.top+r.height/2;dropTarget=card.dataset.id;card.classList.add(dropAfter?'drop-after':'drop-before');e.dataTransfer.dropEffect='move'});
   card.addEventListener('drop',e=>{e.preventDefault();if(!dragged||!dropTarget||dragged===dropTarget)return;const blocks=state.activity.blocks;const from=blocks.findIndex(x=>x.id===dragged);let to=blocks.findIndex(x=>x.id===dropTarget);if(from<0||to<0)return;const [item]=blocks.splice(from,1);if(!item)return;if(from<to)to--;if(dropAfter)to++;blocks.splice(Math.max(0,Math.min(to,blocks.length)),0,item);state.selected=dragged;cleanup();autosave();render()});
 });
 document.addEventListener('dragend',cleanup,{once:true});
 function cleanup(){document.querySelectorAll('.flow-card').forEach(x=>x.classList.remove('dragging','drop-before','drop-after'));dragged=null;dropTarget=null;dropAfter=false;state.draggingId=null}
}
function renderPreviewOnly(){state.previewIndex=Math.max(0,Math.min(state.previewIndex,subCount(current())-1));const p=document.querySelector('.phonewrap');if(p)p.innerHTML=phone(current());document.querySelectorAll('[data-preview-prev]').forEach(el=>el.onclick=()=>{state.previewIndex=Math.max(0,state.previewIndex-1);renderPreviewOnly()});document.querySelectorAll('[data-preview-next]').forEach(el=>el.onclick=()=>{state.previewIndex=Math.min(subCount(current())-1,state.previewIndex+1);renderPreviewOnly()});document.querySelectorAll('.phonewrap [data-action]').forEach(el=>el.onclick=e=>{e.stopPropagation();act(el.dataset.action)});bindMockPreview()}
function act(a){const blocks=state.activity.blocks,i=blocks.findIndex(x=>x.id===state.selected);
 if(a==='moveup'&&i>0){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];autosave();render()}
 else if(a==='movedown'&&i>=0&&i<blocks.length-1){[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];autosave();render()}
 else if(a==='add'){state.modal=true;render()}
 else if(a==='close'){state.modal=false;render()}
 else if(a==='delete'&&blocks.length>1){blocks.splice(i,1);state.selected=blocks[Math.max(0,i-1)].id;state.tab='basic';state.previewIndex=0;autosave();render()}
 else if(a==='sample'){const created=createActivity(sample('emotion'),'sample:emotion');if(created){state.activity=created;state.selected=created.blocks[0].id;state.screen='editor';state.tab='basic';state.previewIndex=0;render()}}
 else if(a==='save'){if(autosave())toast('현재 활동을 저장했습니다.');else toast('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.')}
 else if(a==='export'){const blob=new Blob([JSON.stringify(state.activity,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=(state.activity.title||'activity')+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
 else if(a==='exportAll'){const blob=new Blob([JSON.stringify(libraryStore,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='Drama_Reflect_Builder_전체활동_백업.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast('전체 활동 백업 파일을 만들었습니다.')}
 else if(a==='previewAll'){state.overview=true;render()}
 else if(a==='studentView'){state.flowPreview=true;state.flowComplete=false;state.flowBlock=Math.max(0,state.activity.blocks.findIndex(x=>x.id===state.selected));state.flowSub=0;render()}
 else if(a==='overviewClose'){state.overview=false;render()}
 else if(a==='run'){state.flowPreview=true;state.flowComplete=false;state.flowBlock=0;state.flowSub=0;render()}
 else if(a==='classStart'){if(!autosave()){toast('저장에 실패해 수업 준비를 열지 않았습니다.');return}state.sessionSetup=createSessionDraft();state.facilitatorPreview=false;render()}
 else if(a==='onlineClassStart'){if(!autosave()){toast('저장에 실패해 실시간 수업을 열지 않았습니다.');return}startFirebaseClass()}
 else if(a==='toggleEntry'){if(state.sessionSetup?.status!=='draft')return;if(state.sessionSetup.mode==='firebase')updateFirebaseSession({entryOpen:!state.sessionSetup.entryOpen}).catch(e=>toast(firebaseErrorMessage(e)));else updateSessionState({entryOpen:!state.sessionSetup.entryOpen})}
 else if(a==='sessionRun'){if(state.sessionSetup?.status!=='draft')return;const errors=validateForClass(state.activity);if(errors.length){toast('사전 점검 항목을 먼저 확인해 주세요.');return}if(state.sessionSetup.mode==='firebase'){runFirebaseSession();return}if(!state.sessionSetup.participants?.length){toast('가상 학생을 먼저 생성해 주세요.');return}state.sessionSetup.currentBlock=0;state.sessionSetup.participants.forEach(st=>{st.blockIndex=0;st.status='active'});updateSessionState({status:'running',entryOpen:false,startedAt:nowISO()})}
 else if(a==='sessionEnd'){if(state.sessionSetup?.status!=='running')return;if(!confirm('수업을 종료할까요? 종료하면 새 학생은 더 이상 입장할 수 없습니다.'))return;if(state.sessionSetup.mode==='firebase'){endFirebaseSession();return}else updateSessionState({status:'ended',entryOpen:false,endedAt:nowISO()})}
 else if(a==='sessionClose'){if(state.sessionSetup?.mode==='firebase')stopFirebaseListeners();state.sessionSetup=null;state.facilitatorPreview=false;render()}
 else if(a==='sessionStudentTest'){if(state.sessionSetup){state.sessionReturn=state.sessionSetup;state.sessionReturnFacilitator=state.facilitatorPreview}state.facilitatorPreview=false;state.sessionSetup=null;state.flowPreview=true;state.flowComplete=false;state.flowBlock=0;state.flowSub=0;render()}
 else if(a==='facilitatorPreview'){state.facilitatorPreview=true;render()}
 else if(a==='facilitatorClose'){state.facilitatorPreview=false;render()}
 else if(a==='facilitatorBack'){state.facilitatorPreview=false;render()}
 else if(a==='simulateSpread'){simulateDistributedProgress()}
 else if(a==='alignCurrent'){alignParticipantsToBlock(state.sessionSetup?.currentBlock||0)}
 else if(a==='advanceClass'){if(state.sessionSetup?.mode==='firebase')advanceFirebaseSession();else advanceSessionBlock()}
 else if(a==='meetingAssign'){assignMeetingGroups()}
 else if(a==='moodNames'){const v=moodViewState(state.sessionSetup);setMoodView({showNames:!v.showNames})}
 else if(a==='moodAnonymous'){const v=moodViewState(state.sessionSetup);setMoodView({anonymous:!v.anonymous})}
 else if(a==='copyJoinCode'){const c=state.sessionSetup?.code||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(c).then(()=>toast('참여 코드를 복사했습니다.')).catch(()=>toast(c));else toast(c)}
 else if(a==='copyJoinLink'){const u=studentJoinURL(state.sessionSetup?.code||'');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(u).then(()=>toast('참여 주소를 복사했습니다.')).catch(()=>toast(u));else toast(u)}
 else if(a==='shareBoardOpen'){if(state.sessionSetup?.mode==='firebase'){state.shareBoard=true;render()}}
 else if(a==='shareBoardClose'){state.shareBoard=false;render()}
 else if(a==='studentJoinHome'){location.href=location.pathname+'?student=1'}
 else if(a==='resumeFirebaseSession'){resumeFirebaseClass()}
 else if(a==='clearTeacherSession'){clearTeacherSession();render()}
 else if(a==='studentResumeRecent'){const last=readLastStudentJoin();if(last?.code)location.href=location.pathname+'?join='+encodeURIComponent(last.code)}
 else if(a==='firebaseStudentJoin'){joinFirebaseSession()}
 else if(a==='firebaseSubmitResponse'){saveStudentResponse()}
 else if(a==='studentJoinExit'){location.href=location.pathname}
 else if(a==='flowClose'){state.flowPreview=false;state.flowComplete=false;if(state.sessionReturn){state.sessionSetup=state.sessionReturn;state.facilitatorPreview=state.sessionReturnFacilitator;state.sessionReturn=null;state.sessionReturnFacilitator=false}render()}
 else if(a==='flowRestart'){state.flowComplete=false;state.flowBlock=0;state.flowSub=0;render()}
 else if(a==='panelNext'){const count=subCount(current());if(state.previewIndex<count-1){state.previewIndex++;renderPreviewOnly()}else toast('이 단계의 마지막 미리보기입니다.')}
 else if(a==='flowPrev'){const b=blocks[state.flowBlock];if(state.flowSub>0)state.flowSub--;else if(state.flowBlock>0){state.flowBlock--;state.flowSub=subCount(blocks[state.flowBlock])-1}render()}
 else if(a==='flowNext'){const b=blocks[state.flowBlock],count=subCount(b);if(state.flowSub<count-1)state.flowSub++;else if(state.flowBlock<blocks.length-1){state.flowBlock++;state.flowSub=0}else{state.flowComplete=true}render()}
}

window.addEventListener('online',()=>{if(state.studentMode||state.sessionSetup)render()});
window.addEventListener('offline',()=>{if(state.studentMode||state.sessionSetup)render()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.studentJoin?.joined&&fbAuth?.currentUser?.isAnonymous){const ref=fbDb.collection('sessions').doc(state.studentJoin.sessionId);startStudentHeartbeat(ref,fbAuth.currentUser.uid)}});
if(state.studentMode)tryRestoreStudentSession();
render();
})();
</script>
</body>
