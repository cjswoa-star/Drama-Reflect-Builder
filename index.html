/* V4: clearer flow ordering + richer student preview */
.flow-card{grid-template-columns:30px 38px 1fr auto;position:relative}

 if(b.type==='mood'){body=`<p>${esc(b.note||'')}</p><div class="mood-stage"><div class="mood-label top">에너지 높음</div><div class="mood-label left">불편함</div><div class="mood-map" data-mock-mood role="button" tabindex="0" aria-label="마음지도에서 현재 마음의 위치 선택"><i class="mood-dot"></i></div><div class="mood-label right">기분 좋음</div><div class="mood-label bottom">에너지 낮음</div></div><div class="mood-hint" data-mood-hint>마음지도에서 내 위치를 가볍게 눌러보세요.<span class="small-note">위치를 누르면 가까운 감정어가 나타납니다. · 미리보기 응답은 저장되지 않음</span></div>${(b.emotionLabels||[]).length?`<div class="mood-extra"><div class="mood-extra-label">교사가 추가한 감정어</div><div class="emotion-pills">${(b.emotionLabels||[]).map(x=>`<span data-mock-select>${esc(x)}</span>`).join('')}</div></div>`:''}`;button='이 마음으로 선택하기'}
 if(b.type==='meet'){const method=b.method==='same'?'같은 선택을 한 친구들과':b.method==='different'?'다른 선택을 한 친구들과':b.method==='manual'?'선생님이 정한 친구들과':'새로운 친구들과';body=`<p>${method} 이야기합니다.</p><div class="meet-head"><div class="group-no">3모둠 · 4명 <span class="example-badge">예시</span></div><div class="group-names">가상 학생: 김서연 · 이현우 · 박지훈 · 최민서</div></div><div class="timer">${String(b.minutes||3).padStart(2,'0')}:00</div><div class="timer-label">예시 타이머 · 실제 시간 측정 아님</div>${(b.questions||[]).slice(0,2).map((q,i)=>`<div class="question-box"><b>${i+1}</b> ${esc(q)}</div>`).join('')}${b.startersEnabled!==false?`<div class="starter-preview">${(b.starters||[]).map(s=>`<span data-mock-select>${esc(s)}</span>`).join('')}</div>`:''}<div class="example-note">현재는 화면 구성 미리보기입니다. 실제 모둠 배정·타이머는 별도 Firebase 세션 기능을 붙인 뒤 동작합니다.</div>`;button='이야기 시작하기'}
 if(b.type==='share'){body=`<div class="preview-card"><b>친구들의 생각 <span class="example-badge">예시 응답</span></b><p>“친구 이야기를 듣고 같은 상황도 다르게 느낄 수 있다는 걸 알았어요.”</p></div><div class="preview-card"><p>“내가 왜 답답했는지 조금 알 것 같아요.”</p></div>`;button='함께 보기'}
 if(b.type==='final'){body=`<p>오늘 활동을 돌아보며 한 문장으로 남겨보세요.</p>${b.startersEnabled!==false?`<div class="starter-preview">${(b.starters||[]).map(s=>`<span data-mock-select>${esc(s)}</span>`).join('')}</div>`:''}<textarea aria-label="미리보기 마지막 답안" placeholder="미리보기 입력 · 저장되지 않음" style="width:100%;border:1px solid #dce5eb;border-radius:10px;min-height:120px;margin-top:10px"></textarea>`;button='제출하기'}
 return `<div class="phone"><div class="notch"></div><div class="screen"><div class="mock-note">모의 학생 화면 · 선택과 입력은 저장되지 않습니다.</div><div class="eyebrow">${eyebrow}</div><h4>${esc(b.title||b.name)}</h4>${body}<button class="preview-btn" data-action="${action}">${button}</button><div class="action-label">${mode==='flow'?'전체 흐름 실행 미리보기':'선택 단계 미리보기'}</div></div></div>`}
function overviewHTML(){return `<div class="overview-bg" data-overview-close><div class="overview" onclick="event.stopPropagation()"><div class="overview-head"><div><h3>${esc(state.activity.title)}</h3><div class="tiny-note">${state.activity.blocks.length}단계 전체 흐름</div></div><button data-action="overviewClose">닫기</button></div><div class="overview-list">${state.activity.blocks.map((b,i)=>{const c=catalog[b.type];return `<div class="overview-row" data-overview-jump="${i}"><div class="ovnum" style="background:${c.color}">${i+1}</div><div><b>${esc(b.name||c.label)}</b><small>${esc(b.title||'')}</small></div><span>${c.sub}</span></div>`}).join('')}</div></div></div>`}
function flowPreviewHTML(){const b=state.activity.blocks[state.flowBlock]||state.activity.blocks[0],count=subCount(b),sub=Math.min(state.flowSub,count-1);return `<div class="flow-preview-bg"><div class="flow-preview-shell"><aside class="flow-preview-side"><h3>학생 흐름 미리보기</h3><p>화면 구성 예시를 순서대로 확인합니다. 학생 응답은 저장되지 않습니다.</p><div class="flow-preview-steps">${state.activity.blocks.map((x,i)=>{const c=catalog[x.type];return `<div class="flow-preview-step ${i===state.flowBlock?'on':''}" data-flow-jump="${i}"><div class="num" style="background:${c.color}">${i+1}</div><div><b>${esc(x.name||c.label)}</b><small>${c.sub}</small></div></div>`}).join('')}</div></aside><main class="flow-preview-main"><div class="flow-preview-top"><b>${esc(state.activity.title)}</b><button data-action="flowClose">✕ 닫기</button></div><div class="flow-preview-stage">${phone(b,sub,'flow')}</div><div class="flow-preview-controls"><button data-action="flowPrev" ${state.flowBlock===0&&sub===0?'disabled':''}>← 이전</button><div class="center">${state.flowBlock+1}/${state.activity.blocks.length}단계 · ${sub+1}/${count}화면</div><button class="primary" data-action="flowNext">${state.flowBlock===state.activity.blocks.length-1&&sub===count-1?'미리보기 마치기':'다음 →'}</button></div></main></div></div>`}
function modal(){const groups=[['기본 단계','basic'],['감정·성찰','emotion'],['만남·공유','relation']];return `<div class="modalbg" data-close><div class="modal" onclick="event.stopPropagation()"><h3>단계 추가</h3><p>필요한 단계만 골라 현재 단계 바로 뒤에 추가합니다.</p>${groups.map(([title,g])=>`<div class="category-title">${title}</div><div class="blockgrid">${Object.entries(catalog).filter(([,c])=>c.group===g).map(([type,c])=>`<div class="block" data-type="${type}"><div class="bi">${c.icon}</div><b>${c.label}</b><small>${c.desc}</small></div>`).join('')}</div>`).join('')}<div style="text-align:right;margin-top:18px"><button class="btn" data-action="close">닫기</button></div></div></div>`}
function render(){document.getElementById('app').innerHTML=(state.screen==='home'?home():editor())+(state.overview?overviewHTML():'')+(state.flowPreview?flowPreviewHTML():'');bind()}
function autosave(){if(!state.activity)return false;state.activity.updatedAt=nowISO();state.activity.ownerId=libraryStore.activeUserId;const u=getUser();u.activities[state.activity.id]=state.activity;u.activityOrder=[state.activity.id,...u.activityOrder.filter(x=>x!==state.activity.id)];libraryStore.currentActivityId=state.activity.id;return writeStore(libraryStore)}
function bind(){
 document.querySelectorAll('[data-nav="home"]').forEach(x=>x.onclick=()=>{state.screen='home';state.flowPreview=false;state.overview=false;render()});
 document.querySelectorAll('[data-open-activity]').forEach(x=>x.onclick=()=>{if(openActivity(x.dataset.openActivity)){state.screen='editor';render()}});
 document.querySelectorAll('[data-start]').forEach(x=>x.onclick=()=>{const isBlank=x.dataset.start==='blank';const a=createActivity(isBlank?{title:'새 활동',blocks:[newBlock('intro')]}:sample(),isBlank?'blank':'sample');if(!a){toast('새 활동을 만들지 못했습니다.');return}state.activity=a;state.selected=a.blocks[0].id;state.screen='editor';state.tab='basic';state.previewIndex=0;render()});
 document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.select;state.tab='basic';state.previewIndex=0;render()});
 document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;render()});
 const t=document.getElementById('activityTitle');if(t)t.oninput=e=>{state.activity.title=e.target.value;autosave()};
 document.querySelectorAll('[data-field]').forEach(el=>{const apply=()=>{const b=current(),k=el.dataset.field;b[k]=k==='minutes'?Number(el.value):el.value;autosave();renderPreviewOnly()};el.onchange=apply;if(el.tagName==='INPUT'||el.tagName==='TEXTAREA')el.oninput=apply});
 document.querySelectorAll('[data-list]').forEach(el=>el.oninput=()=>{const b=current(),k=el.dataset.list,i=Number(el.dataset.index);b[k][i]=el.value;autosave();renderPreviewOnly()});
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{const b=current(),k=el.dataset.remove,i=Number(el.dataset.index);b[k].splice(i,1);autosave();render()});
 document.querySelectorAll('[data-add-list]').forEach(el=>el.onclick=()=>{const b=current(),k=el.dataset.addList;b[k]=b[k]||[];b[k].push(k==='starters'?'말문을 입력하세요.':k==='emotionLabels'?'감정어':'질문을 입력하세요.');autosave();render()});
 document.querySelectorAll('[data-method]').forEach(el=>el.onclick=()=>{current().method=el.dataset.method;autosave();render()});
 document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const b=current(),k=el.dataset.toggle;b[k]=!(b[k]!==false);autosave();render()});
 document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{const b=current(),k=el.dataset.step;b.steps=b.steps||{};b.steps[k]=!(b.steps[k]!==false);state.previewIndex=0;autosave();render()});
 document.querySelectorAll('[data-preview-prev]').forEach(el=>el.onclick=()=>{state.previewIndex=Math.max(0,state.previewIndex-1);renderPreviewOnly()});document.querySelectorAll('[data-preview-next]').forEach(el=>el.onclick=()=>{state.previewIndex=Math.min(subCount(current())-1,state.previewIndex+1);renderPreviewOnly()});
 document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{const b=newBlock(el.dataset.type),i=state.activity.blocks.findIndex(x=>x.id===state.selected);state.activity.blocks.splice(i+1,0,b);state.selected=b.id;state.modal=false;state.tab='basic';state.previewIndex=0;autosave();render()});
 document.querySelectorAll('[data-card-move]').forEach(el=>el.onclick=e=>{e.stopPropagation();const bid=el.dataset.id,i=state.activity.blocks.findIndex(x=>x.id===bid);if(el.dataset.cardMove==='up'&&i>0)[state.activity.blocks[i-1],state.activity.blocks[i]]=[state.activity.blocks[i],state.activity.blocks[i-1]];if(el.dataset.cardMove==='down'&&i>=0&&i<state.activity.blocks.length-1)[state.activity.blocks[i+1],state.activity.blocks[i]]=[state.activity.blocks[i],state.activity.blocks[i+1]];state.selected=bid;autosave();render()});
 document.querySelectorAll('[data-overview-jump]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.overviewJump);state.selected=state.activity.blocks[i].id;state.screen='editor';state.overview=false;state.previewIndex=0;render()});
 document.querySelectorAll('[data-overview-close]').forEach(el=>el.onclick=()=>{state.overview=false;render()});
 document.querySelectorAll('[data-flow-jump]').forEach(el=>el.onclick=()=>{state.flowBlock=Number(el.dataset.flowJump);state.flowSub=0;render()});
 document.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>{e.stopPropagation();act(el.dataset.action)});document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{state.modal=false;render()});
 bindMockPreview();bindDrag();
}
function bindMockPreview(){document.querySelectorAll('[data-mock-select]').forEach(el=>{el.onclick=e=>{e.stopPropagation();const p=el.parentElement;if(p)p.querySelectorAll('[data-mock-select]').forEach(x=>x.classList.remove('mock-selected'));el.classList.add('mock-selected');const s=el.closest('.screen')?.querySelector('.mock-state');if(s)s.textContent='모의 선택됨 · 저장되지 않습니다.'};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});document.querySelectorAll('[data-mock-mood]').forEach(grid=>{const choose=e=>{const r=grid.getBoundingClientRect();let clientX=e.clientX,clientY=e.clientY;if(e.touches&&e.touches[0]){clientX=e.touches[0].clientX;clientY=e.touches[0].clientY}const x=Math.max(.02,Math.min(.98,(clientX-r.left)/r.width)),y=Math.max(.02,Math.min(.98,(clientY-r.top)/r.height)),dot=grid.querySelector('.mood-dot');if(dot){dot.style.left=x*100+'%';dot.style.top=y*100+'%'}const words=moodHintWords({x,y}),hint=grid.closest('.screen')?.querySelector('[data-mood-hint]');if(hint)hint.innerHTML=`이 근처의 마음 · <b>${words.map(esc).join(' · ')}</b><span class="small-note">지금은 감정을 하나로 정답처럼 고르는 단계가 아니라, 내 위치 주변의 마음말을 살펴보는 단계예요. · 미리보기 응답은 저장되지 않음</span>`};grid.onclick=choose;grid.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=grid.getBoundingClientRect();choose({clientX:r.left+r.width/2,clientY:r.top+r.height/2})}}})}
function bindDrag(){let dragged=null,dropTarget=null,dropAfter=false;
 document.querySelectorAll('.drag-handle').forEach(handle=>{handle.addEventListener('dragstart',e=>{dragged=handle.dataset.dragId;state.draggingId=dragged;handle.closest('.flow-card').classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragged)}catch(_){} });});
 document.querySelectorAll('.flow-card').forEach(card=>{
   card.addEventListener('dragover',e=>{if(!dragged||card.dataset.id===dragged){dropTarget=null;return}e.preventDefault();document.querySelectorAll('.flow-card').forEach(x=>x.classList.remove('drop-before','drop-after'));const r=card.getBoundingClientRect();dropAfter=e.clientY>r.top+r.height/2;dropTarget=card.dataset.id;card.classList.add(dropAfter?'drop-after':'drop-before');e.dataTransfer.dropEffect='move'});
   card.addEventListener('drop',e=>{e.preventDefault();if(!dragged||!dropTarget||dragged===dropTarget)return;const blocks=state.activity.blocks;const from=blocks.findIndex(x=>x.id===dragged);let to=blocks.findIndex(x=>x.id===dropTarget);if(from<0||to<0)return;const [item]=blocks.splice(from,1);if(!item)return;if(from<to)to--;if(dropAfter)to++;blocks.splice(Math.max(0,Math.min(to,blocks.length)),0,item);state.selected=dragged;cleanup();autosave();render()});
 });
 document.addEventListener('dragend',cleanup,{once:true});
 function cleanup(){document.querySelectorAll('.flow-card').forEach(x=>x.classList.remove('dragging','drop-before','drop-after'));dragged=null;dropTarget=null;dropAfter=false;state.draggingId=null}
}
function renderPreviewOnly(){state.previewIndex=Math.max(0,Math.min(state.previewIndex,subCount(current())-1));const p=document.querySelector('.phonewrap');if(p)p.innerHTML=phone(current());document.querySelectorAll('[data-preview-prev]').forEach(el=>el.onclick=()=>{state.previewIndex=Math.max(0,state.previewIndex-1);renderPreviewOnly()});document.querySelectorAll('[data-preview-next]').forEach(el=>el.onclick=()=>{state.previewIndex=Math.min(subCount(current())-1,state.previewIndex+1);renderPreviewOnly()});document.querySelectorAll('.phonewrap [data-action]').forEach(el=>el.onclick=e=>{e.stopPropagation();act(el.dataset.action)});bindMockPreview()}
function act(a){const blocks=state.activity.blocks,i=blocks.findIndex(x=>x.id===state.selected);
 if(a==='moveup'&&i>0){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];autosave();render()}
 else if(a==='movedown'&&i>=0&&i<blocks.length-1){[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];autosave();render()}
 else if(a==='add'){state.modal=true;render()}
 else if(a==='close'){state.modal=false;render()}
 else if(a==='delete'&&blocks.length>1){blocks.splice(i,1);state.selected=blocks[Math.max(0,i-1)].id;state.tab='basic';state.previewIndex=0;autosave();render()}
 else if(a==='sample'){const created=createActivity(sample(),'sample');if(created){state.activity=created;state.selected=created.blocks[0].id;state.screen='editor';state.tab='basic';state.previewIndex=0;render()}}
 else if(a==='save'){if(autosave())toast('현재 활동을 저장했습니다.');else toast('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.')}
 else if(a==='export'){const blob=new Blob([JSON.stringify(state.activity,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=(state.activity.title||'activity')+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
 else if(a==='exportAll'){const blob=new Blob([JSON.stringify(libraryStore,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='Drama_Reflect_Builder_전체활동_백업.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast('전체 활동 백업 파일을 만들었습니다.')}
 else if(a==='previewAll'){state.overview=true;render()}
 else if(a==='studentView'){state.flowPreview=true;state.flowBlock=Math.max(0,state.activity.blocks.findIndex(x=>x.id===state.selected));state.flowSub=0;render()}
 else if(a==='overviewClose'){state.overview=false;render()}
 else if(a==='run'){state.flowPreview=true;state.flowBlock=0;state.flowSub=0;render()}
 else if(a==='flowClose'){state.flowPreview=false;render()}
 else if(a==='panelNext'){const count=subCount(current());if(state.previewIndex<count-1){state.previewIndex++;renderPreviewOnly()}else toast('이 단계의 마지막 미리보기입니다.')}
 else if(a==='flowPrev'){const b=blocks[state.flowBlock];if(state.flowSub>0)state.flowSub--;else if(state.flowBlock>0){state.flowBlock--;state.flowSub=subCount(blocks[state.flowBlock])-1}render()}
 else if(a==='flowNext'){const b=blocks[state.flowBlock],count=subCount(b);if(state.flowSub<count-1)state.flowSub++;else if(state.flowBlock<blocks.length-1){state.flowBlock++;state.flowSub=0}else{state.flowPreview=false;toast('학생 흐름 미리보기를 종료했습니다.')}render()}
}

render();
})();
</script>
