name: DRB V9-8.9 modal hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drb-v989-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch index.html
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'chatgpt-drb-bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/drb-v989-hotfix.yml
          git add index.html .github/workflows/drb-v989-hotfix.yml
          git commit -m 'fix: restore step modal and unblock builder V9-8.9'
          git push
