name: Fix V9-9.0 scope
on:
  push:
    paths:
      - 'tools/fix_v990_scope.py'
      - '.github/workflows/fix-v990-scope.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair V9-9.0 patch scope
        run: python tools/fix_v990_scope.py
      - name: Commit repaired index and cleanup
        run: |
          rm -f tools/fix_v990_scope.py .github/workflows/fix-v990-scope.yml
          git config user.name "chatgpt-drb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make V9-9.0 mood-emotion linkage execute in app scope"
          git push
